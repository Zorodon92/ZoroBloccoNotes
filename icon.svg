<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="zGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sfondo arrotondato in stile icona moderna -->
  <rect x="32" y="32" width="448" height="448" rx="96" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4"/>

  <!-- Sagoma foglio con angolo piegato -->
  <path d="M128 96 H320 L384 160 V400 C384 408.8 376.8 416 368 416 H128 C119.2 416 112 408.8 112 400 V112 C112 103.2 119.2 96 128 96 Z" fill="url(#sheetGrad)" stroke="#334155" stroke-width="6"/>

  <!-- Piegatura angolo foglio -->
  <path d="M320 96 V152 C320 156.4 323.6 160 328 160 H384 Z" fill="#334155"/>

  <!-- Righe decorative del blocco note -->
  <line x1="160" y1="160" x2="280" y2="160" stroke="#475569" stroke-width="8" stroke-linecap="round"/>
  <line x1="160" y1="208" x2="336" y2="208" stroke="#334155" stroke-width="6" stroke-linecap="round"/>
  <line x1="160" y1="248" x2="336" y2="248" stroke="#334155" stroke-width="6" stroke-linecap="round"/>

  <!-- Simbolo 'Z' dinamico / Katana Slash per Zoro Note -->
  <path d="M168 280 H336 L216 370 H344" fill="none" stroke="url(#zGrad)" stroke-width="24" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
</svg>